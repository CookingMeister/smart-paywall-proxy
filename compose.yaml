services:
  smart-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
      ladder13ft:
        condition: service_started
      ladder-go:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      TIMEOUT: "5000"
      REDIS_URL: "redis://redis:6379"
      LADDER13FT_URL: "http://ladder13ft:8080"
      LADDER_GO_URL: "http://ladder-go:8080"
      TZ: "UTC"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smart-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ladder13ft:
    image: ghcr.io/wasi-master/13ft:latest
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - smart-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ladder-go:
    image: ghcr.io/everywall/ladder:latest
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - smart-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - smart-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - 9001:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  redis-data:
  dockhand_data:

networks:
  smart-net:
    driver: bridge
