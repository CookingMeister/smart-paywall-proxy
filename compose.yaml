# Local development only. The homelab runs this in Kubernetes; see the
# talos-cluster repo (apps/talos-cluster-1/smart-paywall-proxy).
services:
  smart-proxy:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      ladder13ft:
        condition: service_started
      ladder-go:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      TIMEOUT: "5000"
      REDIS_URL: "redis://redis:6379"
      LADDER13FT_URL: "http://ladder13ft:5000"
      LADDER_GO_URL: "http://ladder-go:8080"
      TZ: "UTC"

  # Same versions the cluster pins. Note the tag styles differ upstream.
  ladder13ft:
    image: ghcr.io/wasi-master/13ft:1.3.0

  ladder-go:
    image: ghcr.io/everywall/ladder:v0.0.23

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
